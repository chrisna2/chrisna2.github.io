<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>반복 발화 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 단계 탭 + 주제 칩 + 카드 목록, 듣기 탭에서만 하단 재생 도크(스튜디오 레코더 느낌) */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#e4e9f0; --ink:#121b26; --muted:#5a6878;
  --line:#d3dbe6; --accent:#1f5fd1; --accent-ink:#ffffff; --live:#d8361d; --live-bg:#fdecea;
  --star:#c98a00; --ok:#1c7a4a;
  --font-ui:'IBM Plex Sans','IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
  --font-ko:'IBM Plex Sans KR','IBM Plex Sans',system-ui,'Malgun Gothic',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --surface:#18212c; --surface2:#222d3b; --ink:#e8eef6; --muted:#93a2b5;
  --line:#2b3748; --accent:#6ea2ff; --accent-ink:#0b1626; --live:#ff7358; --live-bg:#3a1f1b;
  --star:#f0b429; --ok:#5fd394; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f151d; --surface:#18212c; --surface2:#222d3b; --ink:#e8eef6; --muted:#93a2b5;
  --line:#2b3748; --accent:#6ea2ff; --accent-ink:#0b1626; --live:#ff7358; --live-bg:#3a1f1b;
  --star:#f0b429; --ok:#5fd394; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;
  padding-inline:16px;padding-block:16px 230px}
body.nodock{padding-block:16px 48px}
.wrap{max-width:720px;margin-inline:auto}
h1{font-size:19px;font-weight:600;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;width:100%;margin-bottom:10px}
.tabs button{flex:1;min-width:0;padding-inline:4px;font-size:13.5px}
.tabs small{display:block;font-size:10.5px;opacity:.75;font-weight:400}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 8px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;font-size:13.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sec{margin-block:22px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec h2{font-size:15.5px;font-weight:600;margin:0;flex:1;min-width:0}
.tag{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;min-height:38px;font-size:13px}
.mini.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 8px 10px 12px;border-left-width:4px}
.card.active{border-color:var(--live);background:var(--live-bg)}
.num{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:4px;min-width:20px}
.txt{min-width:0}
.en{font-size:16px;font-weight:500;overflow-wrap:anywhere;transition:filter .2s}
.ko{font-family:var(--font-ko);font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.acts{display:flex;gap:2px}
.ib{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--surface2)}
.ib.on{color:var(--star)}
.hide .card:not(.shown) .en{filter:blur(7px);user-select:none}
.dock{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.dock .in{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.status{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.bar{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--live);transition:width .25s}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--live);color:#fff;display:grid;place-items:center}
.nav{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.modes{flex:1;min-width:0}
.modes .seg{display:flex}
.modes .seg button{flex:1;padding-inline:4px;font-size:13px}
.settings{background:var(--surface2);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.settings select,.settings input[type=range]{width:100%;min-height:36px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.settings input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent)}
.settings .ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.settings .full{grid-column:1/-1}
.val{font-family:var(--font-mono);color:var(--ink)}
.warn{background:var(--live-bg);border:1px solid var(--live);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
details.tts{margin-bottom:10px}
details.tts summary{cursor:pointer;font-size:13px;color:var(--muted);padding-block:4px}
details.tts .settings{margin-top:6px}

/* 단계 훈련 공통 */
.qcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:12px}
.qlab{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.qen{font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
.qko{font-family:var(--font-ko);color:var(--muted);font-size:14px;margin-top:2px}
.qcard .row2{margin:10px 0 0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:13px;min-height:36px;text-align:left}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.blank{display:inline-block;min-width:3.2em;height:1.05em;border-bottom:2px solid var(--accent);vertical-align:-3px;margin-inline:2px}
mark{background:transparent;color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.bcard{cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;width:100%}
.bcard.shown{border-color:var(--ok)}
.flow{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.flow li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.flow b{font-family:var(--font-mono);font-size:12px;color:var(--accent);padding-top:3px}
.flow .k{font-family:var(--font-ko);font-weight:500}
.flow small{display:block;color:var(--muted);font-size:13px}
.ans{display:flex;flex-direction:column;gap:6px;margin-block:10px 12px}
.ans div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.ans .e{font-weight:500}
.ans .k{font-family:var(--font-ko);color:var(--muted);font-size:13.5px}
.nav2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:6px}
.nav2 .g{display:flex;gap:8px;flex-wrap:wrap}
.cnt{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.big{min-height:46px;padding-inline:18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.big.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big.live{background:var(--live);color:#fff;border-color:var(--live)}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:18px 8px;text-align:center}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:44px;font-weight:500}
.ring .t small{display:block;font-family:var(--font-ui);font-size:13px;color:var(--muted)}
.phase{font-size:17px;font-weight:600}
.cap{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px;max-width:100%;overflow-wrap:anywhere}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:8px}
.res summary{cursor:pointer;display:flex;gap:10px;align-items:center;padding-block:8px;list-style:none}
.res summary::-webkit-details-marker{display:none}
.res .n{font-family:var(--font-mono);color:var(--muted);font-size:12px}
.res .tt{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.res .sec2{font-family:var(--font-mono);font-size:12.5px}
.low{color:var(--live)}
.tbl{border-collapse:collapse;font-size:13px;min-width:560px;margin-block:6px 10px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl thead th{background:var(--surface2);font-weight:600;color:var(--muted);font-size:12px}
.tbl tbody th{white-space:nowrap;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.chip{padding-inline:12px}.en{font-size:15.5px}.tabs button{font-size:12.5px}}
</style>

<div class="wrap">
  <h1>반복 발화 플레이어</h1>
  <p class="sub">내 소재로 만든 스크립트를 듣고, 빈칸을 채우고, 키워드만 보고 말하고, 모의고사로 마무리합니다.</p>
  <div id="warn" class="warn" hidden>이 브라우저는 음성 재생을 지원하지 않습니다. Chrome이나 Safari에서 열어 주세요. 화면 연습은 그대로 쓸 수 있습니다.</div>
  <div class="seg tabs" id="tabs" role="group" aria-label="훈련 단계"></div>
  <details class="tts">
    <summary>음성 설정 (속도·목소리)</summary>
    <div class="settings">
      <label>속도 <span class="val" id="rateV"></span><input id="rate" type="range" min="0.6" max="1.3" step="0.05"></label>
      <label>목소리 <select id="voice"></select></label>
    </div>
  </details>
  <div class="chips" id="chips" role="group" aria-label="주제"></div>

  <div id="v-listen">
    <div class="row2"><span class="lbl">재생 범위</span><div class="seg" id="scope" role="group" aria-label="재생 범위"></div></div>
    <div id="main"></div>
  </div>
  <div id="v-blank" hidden></div>
  <div id="v-kw" hidden></div>
  <div id="v-skel" hidden></div>
  <div id="v-mock" hidden></div>
</div>

<div class="dock" id="dock">
  <div class="in">
    <div id="panel" class="settings" hidden>
      <label>반복 단위
        <select id="unit"><option value="sent">문장마다 반복</option><option value="block">묶음 통째로 반복</option></select></label>
      <label>반복 횟수 <span class="val" id="repsV"></span><input id="reps" type="range" min="1" max="5" step="1"></label>
      <label>따라 말할 시간
        <select id="gap"><option value="0">짧게</option><option value="1">보통</option><option value="2">길게</option></select></label>
      <label class="ck"><input id="random" type="checkbox"> 문장마다 목소리 바꾸기</label>
      <label class="ck full"><input id="withQ" type="checkbox"> 묶음마다 문제를 먼저 읽어 주기 (문제 → 답변 문장 순서로 이어 재생)</label>
      <label class="ck"><input id="loop" type="checkbox"> 끝나면 처음부터 반복</label>
      <label class="ck full"><input id="hideEn" type="checkbox"> 영어 가리기 (문장을 눌러 확인)</label>
    </div>
    <div class="status"><span id="stTxt">대기 중</span><span id="stRep"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="ctl">
      <button class="nav" id="prev" aria-label="이전 문장"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="play" id="play" aria-label="재생"></button>
      <button class="nav" id="next" aria-label="다음 문장"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <div class="modes"><div class="seg" id="modes" role="group" aria-label="연습 방식"></div></div>
      <button class="nav" id="gear" aria-label="설정" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
  </div>
</div>

<script>
/* ===== 데이터 =====
 묶음: {t 제목, tag 문제번호, q:[영어 문제, 한글 문제], s:[[영어({}=내가 채울 부분), 한글, 키워드]]} */
const TOPICS=[
{name:"기억에 남는 경험",secs:[
 {t:"① 노을 (좋은 경험)",tag:"4·7·10",q:["Tell me about a memorable experience you had outdoors. What happened?","야외에서 겪은 기억에 남는 경험을 말해 주세요. 무슨 일이 있었나요?"],s:[
  ["One of my most memorable experiences was {watching a beautiful sunset}.","가장 기억에 남는 경험 중 하나는 아름다운 노을을 본 거예요.","노을 본 경험"],
  ["{Two weeks ago}, I was {jogging in Boramae Park} when I saw {a stunning sunset}.","2주 전에 보라매공원에서 조깅하다가 멋진 노을을 봤어요.","2주 전 · 보라매 조깅"],
  ["The sky turned {orange and red}, so I {stopped running for a moment}.","하늘이 주황색과 붉은색으로 물들어서 잠깐 달리기를 멈췄어요.","하늘 색 · 잠깐 멈춤"],
  ["I was so {amazed} to see the {beautiful colors}.","아름다운 색을 보고 정말 놀랐어요.","감탄"],
  ["The moment made me feel {peaceful and happy}.","그 순간 마음이 평온하고 행복했어요.","평온 · 행복"]]},
 {t:"② 갑자기 비 (예상 밖 상황)",tag:"4·7·10",q:["Tell me about an unexpected situation that turned out well.","예상 못 한 상황이 좋게 끝난 경험을 말해 주세요."],s:[
  ["One of my memorable experiences was when {it suddenly started raining}.","기억에 남는 경험 중 하나는 갑자기 비가 내리기 시작했을 때예요.","갑자기 비"],
  ["I was {riding my bike in Boramae Park}, and I {didn't have an umbrella}.","보라매공원에서 자전거를 타고 있었는데 우산이 없었어요.","자전거 · 우산 없음"],
  ["I ran to {a nearby Starbucks} and waited there {until the rain stopped}.","근처 스타벅스로 뛰어가서 비가 그칠 때까지 기다렸어요.","스타벅스로 피함"],
  ["Surprisingly, that time wasn't bad at all. I enjoyed {a warm coffee} and relaxed.","놀랍게도 그 시간은 전혀 나쁘지 않았어요. 따뜻한 커피를 마시며 쉬었어요.","따뜻한 커피 · 여유"],
  ["I realized that {not everything is bad, even in unexpected situations}.","예상 밖의 상황에서도 모든 게 나쁘지만은 않다는 걸 깨달았어요.","깨달음"]]},
 {t:"③ 지갑 분실 (나쁜 경험)",tag:"4·7·10",q:["Tell me about a bad experience you remember well. What happened and how did you feel?","잘 기억나는 안 좋은 경험을 말해 주세요. 무슨 일이 있었고 기분이 어땠나요?"],s:[
  ["One of my most memorable experiences was {losing my wallet on the subway}.","가장 기억에 남는 경험 중 하나는 지하철에서 지갑을 잃어버린 거예요.","지하철 지갑 분실"],
  ["One day, I was on the subway, and I realized later that I {left my wallet on the seat}.","어느 날 지하철에서 나중에야 지갑을 좌석에 두고 내린 걸 알았어요.","좌석에 두고 내림"],
  ["I felt very {stressed} because {my cards were in it}.","카드가 들어 있어서 스트레스를 많이 받았어요.","스트레스 · 카드"],
  ["The experience taught me to be {more careful with my belongings}.","그 경험으로 소지품을 더 조심해야 한다는 걸 배웠어요.","교훈"],
  ["Luckily, I got it back from the {lost and found}.","다행히 분실물 센터에서 되찾았어요. (결말은 가정)","결말: 되찾음"]]},
 {t:"첫 문장에 장소만 갈아끼우기",tag:"공통",s:[
  ["One of my most memorable experiences happened {when I was jogging}.","가장 기억에 남는 경험은 조깅하던 때 있었어요.","조깅"],
  ["One of my most memorable experiences happened {at Starbucks}.","가장 기억에 남는 경험은 스타벅스에서 있었어요.","스타벅스"],
  ["One of my most memorable experiences happened {when I went to the movie theater}.","가장 기억에 남는 경험은 영화관에 갔을 때 있었어요.","영화관"],

const RP_TI=TOPICS.length-1;
const plain=s=>s.replace(/[{}]/g,'');

/* ===== 상태 ===== */
const store={
  get(k,d){try{const v=localStorage.getItem('opicLoop.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('opicLoop.'+k,JSON.stringify(v))}catch(e){}}
};
const cfg=Object.assign({view:'listen',unit:'sent',withQ:true,skSk:'A',skKey:'cafe',skHint:false,mode:'shadow',rate:0.9,reps:2,gap:1,loop:true,voice:'',random:false,hideEn:false,scope:'sec',topic:0,sec:0,
  bsec:0,koHint:true,kwScope:'topic',kwShuffle:false,kwHint:'kw',mockMode:'full',mockSecs:60,mockCaption:false,mockAuto:true},store.get('cfg',{}));
let weak=new Set(store.get('weak',[]));
let weakSec=new Set(store.get('weakSec',[]));
const ITEMS=[];
TOPICS.forEach((tp,ti)=>tp.secs.forEach((sc,si)=>sc.s.forEach((p,ni)=>ITEMS.push({id:ti+'.'+si+'.'+ni,ti,si,ni,en:plain(p[0]),ko:p[1]}))));
const byId=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
if(cfg.topic>=TOPICS.length)cfg.topic=0;
let queue=[],qi=0,playing=false,token=0,wake=null,cancelSleep=null,revealed=new Set(),curRep=0;
const $=s=>document.querySelector(s);
const save=()=>store.set('cfg',cfg);
const SYNTH='speechSynthesis' in window;
if(!SYNTH)$('#warn').hidden=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ===== 아이콘 ===== */
const ICON_PLAY='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const ICON_SPK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const ICON_STAR=on=>'<svg width="20" height="20" viewBox="0 0 24 24" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tplHtml=(en,filled)=>esc(en).replace(/\{([^}]*)\}/g,(m,w)=>filled?'<mark>'+w+'</mark>':'<span class="blank" style="min-width:'+Math.max(3,Math.min(11,w.length*0.55)).toFixed(1)+'em"></span>');

/* ===== 음성 ===== */
let voices=[];
function loadVoices(){
  if(!SYNTH)return;
  voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const sel=$('#voice');
  sel.innerHTML='<option value="">자동 (영어 기본)</option>'+voices.map(v=>'<option value="'+esc(v.name)+'">'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('');
  sel.value=cfg.voice&&voices.some(v=>v.name===cfg.voice)?cfg.voice:'';
}
function pickVoice(){
  if(!voices.length)return null;
  if(cfg.random)return voices[Math.floor(Math.random()*voices.length)];
  const f=voices.find(v=>v.name===cfg.voice);
  if(f)return f;
  return voices.find(v=>/en-US/i.test(v.lang))||voices[0];
}
function speak(text,voice){
  return new Promise(res=>{
    if(!SYNTH){res();return}
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang}
    u.rate=cfg.rate;
    let done=false,tm=null;
    const fin=()=>{if(!done){done=true;clearTimeout(tm);res()}};
    u.onend=fin;u.onerror=fin;
    const w=text.split(/\s+/).length;
    tm=setTimeout(fin,(1500+w*650)/cfg.rate+2500);
    try{speechSynthesis.speak(u)}catch(e){fin()}
  });
}
const say=t=>speak(t,pickVoice());
function sleep(ms){return new Promise(res=>{const t=setTimeout(()=>{cancelSleep=null;res()},ms);cancelSleep=()=>{clearTimeout(t);cancelSleep=null;res()}})}
function gapMs(en){const w=en.split(/\s+/).length;return (900+w*400)*[0.7,1,1.6][cfg.gap]}
function stopAudio(){if(cancelSleep)cancelSleep();if(SYNTH)try{speechSynthesis.cancel()}catch(e){}}
async function keepAwake(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}
function releaseAwake(){try{if(wake){wake.release();wake=null}}catch(e){}}
function beep(f){try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},180)}catch(e){}}
function stopAll(){token++;playing=false;curRep=0;sk.playing=false;mockClear();stopAudio();setPlayIcon();setStatus();releaseAwake()}

function buildQueue(){
  const t=cfg.topic;
  if(cfg.scope==='all')return ITEMS.slice();
  if(cfg.scope==='weak')return ITEMS.filter(i=>weak.has(i.id));
  if(cfg.scope==='topic')return ITEMS.filter(i=>i.ti===t);
  return ITEMS.filter(i=>i.ti===t&&i.si===cfg.sec);
}
async function run(start){
  stopAudio();
  const my=++token;
  queue=buildQueue();
  if(!queue.length){playing=false;setPlayIcon();setStatus();$('#stTxt').textContent='재생할 문장이 없습니다';return}
  qi=Math.max(0,Math.min(start,queue.length-1));
  playing=true;setPlayIcon();keepAwake();
  while(my===token){
    if(qi>=queue.length){
      if(cfg.loop){qi=0;[...revealed].forEach(id=>reveal(id,false));continue}
      break;
    }
    const it=queue[qi];
    if(it.ti!==cfg.topic){cfg.topic=it.ti;renderChips();renderMain()}
    [...revealed].forEach(id=>reveal(id,false));
    if(cfg.unit==='block'){
      // 묶음 통째로: 문제 → 문장들을 쉬지 않고 이어서, 묶음 전체를 반복
      const base=qi,blk=[];
      for(let k=base;k<queue.length&&queue[k].ti===it.ti&&queue[k].si===it.si;k++)blk.push(queue[k]);
      const sq=TOPICS[it.ti].secs[it.si].q;
      const total=blk.reduce((a,x)=>a+gapMs(x.en),0);
      for(let r=1;r<=cfg.reps;r++){
        curRep=r;qi=base;setStatus();
        [...revealed].forEach(id=>reveal(id,false));
        markActive(blk[0]);
        if(cfg.withQ&&sq){
          const qe=document.getElementById('q'+it.ti+'.'+it.si);
          if(qe)qe.style.color='var(--live)';
          $('#stTxt').textContent='문제';
          await say(sq[0]);
          if(qe)qe.style.color='';
          if(my!==token)return;
          await sleep(cfg.mode==='listen'?250:1000);if(my!==token)return;
        }
        if(cfg.mode==='recall'){
          await sleep(total*0.9);if(my!==token)return;
          blk.forEach(x=>reveal(x.id,true));
        }
        for(let k=0;k<blk.length;k++){
          qi=base+k;setStatus();markActive(blk[k]);
          await say(blk[k].en);if(my!==token)return;
          await sleep(450);if(my!==token)return;
        }
        qi=base;
        if(!(cfg.mode==='listen'&&r===cfg.reps)){await sleep(cfg.mode==='listen'?900:total*0.8);if(my!==token)return}
      }
      qi=base+blk.length;
      continue;
    }
    markActive(it);curRep=0;setStatus();
    if(cfg.withQ&&it.ni===0){
      const sq=TOPICS[it.ti].secs[it.si].q;
      if(sq){
        const qe=document.getElementById('q'+it.ti+'.'+it.si);
        if(qe)qe.style.color='var(--live)';
        $('#stTxt').textContent='문제';
        await say(sq[0]);
        if(qe)qe.style.color='';
        if(my!==token)return;
        await sleep(cfg.mode==='listen'?250:1200);if(my!==token)return;
        setStatus();
      }
    }
    if(cfg.mode==='recall'){
      curRep=1;setStatus();
      await sleep(gapMs(it.en)*1.3);if(my!==token)return;
      reveal(it.id,true);
      for(let r=1;r<=cfg.reps;r++){
        curRep=r;setStatus();
        await say(it.en);if(my!==token)return;
        await sleep(gapMs(it.en));if(my!==token)return;
      }
    }else if(cfg.mode==='shadow'){
      for(let r=1;r<=cfg.reps;r++){
        curRep=r;setStatus();
        await say(it.en);if(my!==token)return;
        await sleep(gapMs(it.en));if(my!==token)return;
      }
    }else{
      for(let r=1;r<=cfg.reps;r++){
        curRep=r;setStatus();
        await say(it.en);if(my!==token)return;
        await sleep(700);if(my!==token)return;
      }
    }
    qi++;
  }
  if(my===token){playing=false;curRep=0;setPlayIcon();setStatus();releaseAwake()}
}

function genSec(skId,key){
  const S=SKELS.find(s=>s.id===skId),sl=S.slots[key];
  const qd=S.qs?S.qs[key]:["Tell me about a memorable experience you had "+SK_Q[key][0]+". What happened?",SK_Q[key][1]+" 겪은 기억에 남는 경험을 말해 주세요. 무슨 일이 있었나요?"];
  const fill=(t,i,mark)=>t.replace(/<(\w+)>/g,(m,k)=>mark?'{'+sl[k][i]+'}':sl[k][i]);
  return {t:S.name+' × '+kn(S,key),tag:S.tag,gen:true,
    q:qd,
    s:S.parts.map(p=>[fill(p[0],0,true),fill(p[1],1,false),p[2],[...p[0].matchAll(/<(\w+)>/g)].map(m=>sl[m[1]][1]).join(' / ')])};
}

function buildMock(){
  const used=new Set(),qs=[];
  const pool=[];TOPICS.forEach((t,i)=>{if(!t.rp&&t.name!=='기억에 남는 경험')pool.push(i)});
  const mem=[];TOPICS.forEach((t,ti)=>t.secs.forEach((s,si)=>{if(s.q&&s.tag==='4·7·10')mem.push({ti,si})}));
  const n=cfg.mockMode==='short'?1:3;
  const add=(c,kind)=>{const a=c.filter(x=>!used.has(x.ti+'.'+x.si));const x=pick(a.length?a:c);used.add(x.ti+'.'+x.si);qs.push({ti:x.ti,si:x.si,kind})};
  shuffle(pool.slice()).slice(0,n).forEach(ti=>{
    const secs=qSecs(ti).map(x=>({ti,si:x.i,tag:x.s.tag}));
    const d=secs.filter(x=>x.tag==='2·5·8'),h=secs.filter(x=>x.tag==='3'||x.tag==='6·9'),m=secs.filter(x=>x.tag==='4·7·10');
    const key=SKEY[TOPICS[ti].name];
    const genQ=(tags,kind)=>{const o=SKELS.filter(s=>tags.includes(s.tag)&&s.slots[key]);if(!key||!o.length)return false;qs.push({ti,si:-1,kind:kind+' (뼈대 응용)',gen:true,sec:genSec(pick(o).id,key)});return true};
    if(!(Math.random()<0.5&&genQ(['2·5·8'],'묘사')))add(d.length?d:secs,'묘사');
    if(!(Math.random()<0.5&&genQ(['3','6·9'],'습관·비교·최근')))add(h.length?h:secs,'습관·비교·최근');
    if(!((!m.length||Math.random()<0.5)&&genQ(['4·7·10'],'기억에 남는 경험')))add(m.length?m:mem,'기억에 남는 경험');
  });
  const rp=qSecs(RP_TI).map(x=>({ti:RP_TI,si:x.i,tag:x.s.tag}));
  const genRP=(tag,kind)=>{const sk0=pick(SKELS.filter(s=>s.tag===tag));qs.push({ti:RP_TI,si:-1,kind:kind+' (뼈대 응용)',gen:true,sec:genSec(sk0.id,pick(Object.keys(sk0.slots)))})};
  if(Math.random()<0.5)genRP('RP12','롤플레이 12');else add(rp.filter(x=>x.tag==='RP12'),'롤플레이 12');
  if(Math.random()<0.5)genRP('RP13','롤플레이 13');else add(rp.filter(x=>x.tag==='RP13'),'롤플레이 13');
  return qs;
}

  let h='<div class="stage"><div class="cnt">Q '+(mock.i+1)+' / '+mock.qs.length+' · '+esc(q.kind)+'</div>'+
    '<div class="phase" id="mPhase">'+label+'</div>'+

    '<div class="t"><span id="mT">'+(ph==='ask'?'♪':Math.ceil(mock.left))+'</span></div></div>';
  if(cfg.mockCaption)h+='<div class="cap">'+esc(sc.q[0])+'</div>';
  h+='<div class="row2" style="justify-content:center">';
  if(ph==='ready'||ph==='ask')h+='<button class="big" data-mreplay="1"'+(mock.replayed||ph==='ask'?' disabled':'')+'>문제 다시 듣기 (1회)</button><button class="big live" data-mgo="1">지금 시작</button>';
  if(ph==='answer')h+='<button class="big pri" data-mnext="1">답변 끝 · 다음 문제</button>';
  if(ph==='done')h+='<button class="big pri" data-mnext="1">다음 문제</button>';
  h+='<button class="big" data-mquit="1">그만하기</button></div></div>';
  el.innerHTML=h;
}
function mockTick(){
  const ring=$('#mRing'),t=$('#mT');
  const total=mock.phase==='answer'?mock.total:5;
  if(ring)ring.setAttribute('stroke-dashoffset',String(565.5*(1-Math.max(0,mock.left)/total)));
  if(t)t.textContent=String(Math.max(0,Math.ceil(mock.left)));
}
function mockTimer(secs,onEnd){
  if(mock.iv)clearInterval(mock.iv);
  const t0=Date.now();mock.left=secs;mockTick();
  mock.iv=setInterval(()=>{
    mock.left=secs-(Date.now()-t0)/1000;mockTick();
    if(mock.left<=0){clearInterval(mock.iv);mock.iv=null;mock.left=0;mockTick();onEnd()}
  },200);
}
async function mockAsk(){
  stopAudio();const my=++token;
  const q=mock.qs[mock.i],sc=secOf(q);
  mock.phase='ask';mock.replayed=false;renderMock();
  await say(sc.q[0]);if(my!==token)return;
  mockReady(my);
}
function mockReady(my){
  mock.phase='ready';renderMock();
  mockTimer(5,()=>{if(my===token)mockAnswer(my)});
}
function mockAnswer(my){
  mock.phase='answer';mock.t0=Date.now();renderMock();beep(880);
  mockTimer(mock.total,()=>{
    mock.res[mock.i]=mock.total;beep(440);mock.phase='done';renderMock();
    if(cfg.mockAuto)setTimeout(()=>{if(my===token&&mock.phase==='done')mockNext()},1500);
  });
}
function mockNext(){
  if(mock.phase==='answer'){mock.res[mock.i]=Math.min(mock.total,Math.round((Date.now()-mock.t0)/1000))}
  if(mock.iv){clearInterval(mock.iv);mock.iv=null}
  if(mock.i+1>=mock.qs.length){token++;stopAudio();mock.phase='result';renderMock();window.scrollTo({top:0});return}
  mock.i++;mockAsk();
}
function mockStart(){
  stopAll();
  mock.qs=buildMock();mock.i=0;mock.res=[];mock.total=cfg.mockSecs;mock.on=true;
  keepAwake();mockAsk();
}

function jump(dir){
  if(!queue.length){run(0);return}
  if(cfg.unit!=='block'){run(Math.max(0,Math.min(queue.length-1,qi+dir)));return}
  const key=x=>x.ti+'.'+x.si,cur=key(queue[qi]);
  let i=qi;
  if(dir>0){while(i<queue.length&&key(queue[i])===cur)i++;if(i>=queue.length)i=0}
  else{
    let s=qi;while(s>0&&key(queue[s-1])===cur)s--;
    if(qi>s)i=s;
    else{i=s-1;if(i<0)i=queue.length-1;const k=key(queue[i]);while(i>0&&key(queue[i-1])===k)i--}
  }
  run(i);
}
