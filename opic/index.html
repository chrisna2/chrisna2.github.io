<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>반복 발화 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
/>
<link rel="stylesheet" href="style.css" />

<div class="wrap">
  <h1>반복 발화 플레이어</h1>
  <p class="sub">
    내 소재로 만든 스크립트를 듣고, 빈칸을 채우고, 키워드만 보고 말하고, 모의고사로 마무리합니다.
  </p>
  <div id="warn" class="warn" hidden>
    이 브라우저는 음성 재생을 지원하지 않습니다. Chrome이나 Safari에서 열어 주세요. 화면 연습은
    그대로 쓸 수 있습니다.
  </div>
  <div class="seg tabs cats" id="cats" role="group" aria-label="대분류"></div>
  <p class="note" id="catnote"></p>
  <div class="seg tabs" id="tabs" role="group" aria-label="훈련 단계"></div>
  <details class="tts">
    <summary>음성 설정 (속도·목소리)</summary>
    <div class="settings">
      <label
        >속도 <span class="val" id="rateV"></span
        ><input id="rate" type="range" min="0.6" max="1.3" step="0.05"
      /></label>
      <label
        >목소리
        <select id="voice"></select
      ></label>
    </div>
  </details>
  <div class="chips" id="chips" role="group" aria-label="주제"></div>

  <div id="v-listen">
    <div class="row2">
      <span class="lbl">재생 범위</span>
      <div class="seg" id="scope" role="group" aria-label="재생 범위"></div>
    </div>
    <div id="main"></div>
  </div>
  <div id="v-blank" hidden></div>
  <div id="v-kw" hidden></div>
  <div id="v-skel" hidden></div>
  <div id="v-mock" hidden></div>
</div>

<div class="dock" id="dock">
  <div class="in">
    <div id="panel" class="settings" hidden>
      <label
        >반복 단위
        <select id="unit">
          <option value="sent">문장마다 반복</option>
          <option value="block">묶음 통째로 반복</option>
        </select></label
      >
      <label
        >반복 횟수 <span class="val" id="repsV"></span
        ><input id="reps" type="range" min="1" max="5" step="1"
      /></label>
      <label
        >따라 말할 시간
        <select id="gap">
          <option value="0">짧게</option>
          <option value="1">보통</option>
          <option value="2">길게</option>
        </select></label
      >
      <label class="ck"><input id="random" type="checkbox" /> 문장마다 목소리 바꾸기</label>
      <label class="ck full"
        ><input id="withQ" type="checkbox" /> 묶음마다 문제를 먼저 읽어 주기 (문제 → 답변 문장
        순서로 이어 재생)</label
      >
      <label class="ck"><input id="loop" type="checkbox" /> 끝나면 처음부터 반복</label>
      <label class="ck full"
        ><input id="hideEn" type="checkbox" /> 영어 가리기 (문장을 눌러 확인)</label
      >
    </div>
    <div class="status"><span id="stTxt">대기 중</span><span id="stRep"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="ctl">
      <button class="nav" id="prev" aria-label="이전 문장">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 5h2v14H6zM20 5v14L9 12z" />
        </svg>
      </button>
      <button class="play" id="play" aria-label="재생"></button>
      <button class="nav" id="next" aria-label="다음 문장">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 5h2v14h-2zM4 5v14l11-7z" />
        </svg>
      </button>
      <div class="modes">
        <div class="seg" id="modes" role="group" aria-label="연습 방식"></div>
      </div>
      <button class="nav" id="gear" aria-label="설정" aria-expanded="false">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
          <circle cx="16" cy="7" r="2" />
          <circle cx="8" cy="17" r="2" />
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body></html>
